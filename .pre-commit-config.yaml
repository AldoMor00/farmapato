# Red de seguridad de formato a nivel de git: ningún commit entra sin pasar por
# ruff, sin importar qué agente o editor escribió el código.
#
# `repo: local` + `language: system` a propósito: los hooks llaman al ruff que ya
# fija uv.lock en vez de que pre-commit se cree su propio entorno. Así hay una
# sola versión de ruff en el proyecto y una sola configuración (pyproject.toml).
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]

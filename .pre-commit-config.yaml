# Red de seguridad de formato a nivel de git: ningún commit entra sin pasar por
# los hooks, sin importar qué agente o editor escribió el archivo.
#
# La regla no es «nunca un repo externo», es **una sola versión de cada
# herramienta**. Ruff va con `repo: local` + `language: system` porque `uv.lock`
# ya lo fija: si pre-commit instalara el suyo, acabarían discrepando y el commit
# pasaría el hook en local para morir en CI por formato. Los hooks genéricos de
# abajo no existen en ningún otro sitio del proyecto, así que no hay con qué
# desincronizarse y sí pueden venir de fuera.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]

  # Hasta que entró dbt, todo lo versionado era Python y estos dos hooks lo
  # cubrían entero. Con YAML y SQL dentro hay archivos que ningún hook mira:
  # `types: [python]` los ignora, y de ahí salieron tres .yml sin newline final.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

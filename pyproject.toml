[project]
name = "farmapato"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "adbc-driver-postgresql>=1.12.0",
    "faker>=40.36.0",
    "numpy>=2.5.1",
    "polars>=1.43.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# Los tests viven por componente, no en un /tests raíz: cada uno con su toolchain.
testpaths = ["generator/tests", "loader/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes; I: import sorting; UP: modernización de sintaxis;
# B: bugbear (bugs comunes); SIM: simplificaciones.
select = ["E", "F", "I", "UP", "B", "SIM"]

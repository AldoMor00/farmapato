[project]
name = "farmapato"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes; I: import sorting; UP: modernización de sintaxis;
# B: bugbear (bugs comunes); SIM: simplificaciones.
select = ["E", "F", "I", "UP", "B", "SIM"]

# Este archivo vive en la raíz del proyecto dbt, no en ~/.dbt/, que es lo que
# recomienda dbt. La desviación es deliberada: esa recomendación existe para
# mantener credenciales fuera del control de versiones, y aquí no hay ninguna.
# Todos los valores salen del entorno y `.env` está ignorado. A cambio la
# conexión queda declarada donde un revisor la ve, y CI no tiene que fabricar
# el archivo con un heredoc — que es como acaban las contraseñas en un log.
#
# La raíz del proyecto y no el directorio de trabajo ni DBT_PROFILES_DIR: de
# las tres, es la única que dbt Fusion también reconoce.
#
# NUNCA un valor literal aquí. Sin `default` en env_var, si falta una variable
# dbt falla nombrándola, que es exactamente lo que tiene que pasar.

farmapato:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4
